name: tdx-dev
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip>=26
  # Core dependencies
  - requests>=2.31
  - pandas>=2.2
  - geopandas>=0.14
  - pyarrow>=15
  - msgspec>=0.18
  - shapely>=2.0
  - pyproj>=3.6
  # Development tools
  - pytest>=8
  - pytest-mock>=3.14
  - ruff>=0.6
  - mypy>=1.11
  # Jupyter notebook support (optional but useful)
  - jupyter>=1.0
  - ipython>=8.0
  - jupyterlab>=4.0
  # Build tools
  - setuptools>=69
  - wheel
  - pip:
    # Development dependencies from pyproject.toml
    - types-requests>=2.32
