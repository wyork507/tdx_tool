name: tdx-dev
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip>=26
  # Core dependencies
  - requests>=2.33
  - pandas>=3.0
  - geopandas>=1.1
  - pyarrow>=24.0
  - msgspec>=0.21
  - shapely>=2.1
  - pyproj>=3.7
  - xarray>=2026.4
  # Development tools
  - pytest>=9.0
  - pytest-mock>=3.15
  - ruff>=0.15
  - mypy>=1.20
  # Jupyter notebook support (optional but useful)
  - jupyter>=1.1
  - ipython>=9.13
  - jupyterlab>=4.5
  # Build tools
  - setuptools>=69
  - wheel
  - pip:
    # Development dependencies from pyproject.toml
    - types-requests>=2.32
