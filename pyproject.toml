[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdx-tool"
version = "0.1.0"
description = "Python client for Taiwan TDX transport API"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
	{ name = "tdx_tool contributors" }
]
keywords = ["tdx", "transport", "taiwan", "bus", "api"]
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Operating System :: OS Independent"
]
dependencies = [
	"requests>=2.31",
	"pandas>=2.2",
	"geopandas>=0.14",
	"pyarrow>=15"
]

[project.optional-dependencies]
dev = [
	"pytest>=8",
	"pytest-mock>=3.14",
	"ruff>=0.6",
	"mypy>=1.11",
	"types-requests>=2.32"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
packages = ["tdx_tool"]
warn_unused_configs = true
warn_return_any = true
