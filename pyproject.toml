[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdx-tool"
version = "0.1.0"
description = "Python client for Taiwan TDX transport API"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
	{ name = "wyork507" }
]
keywords = ["tdx", "transport", "taiwan", "bus", "rail", "bike", "api"]
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Operating System :: OS Independent"
]
dependencies = [
	"requests>=2.33",
	"pandas>=3.0",
	"geopandas>=1.1",
	"pyarrow>=24.0",
	"msgspec>=0.21",
	"shapely>=2.1",
	"pyproj>=3.7",
	"xarray>=2026.4"
]

[project.urls]
Homepage = "https://github.com/wyork507/tdx_tool"
Source = "https://github.com/wyork507/tdx_tool"

[project.optional-dependencies]
dev = [
	"pytest>=9.0",
	"pytest-mock>=3.15",
	"ruff>=0.15",
	"mypy>=1.20",
	"types-requests>=2.33"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tdx_tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
packages = ["tdx_tool"]
warn_unused_configs = true
warn_return_any = true
